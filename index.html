<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanmay AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: min(900px, 95vw);
            height: 90vh;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 20px;
            border-bottom: 1px solid #e5e7eb;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        header p {
            margin: 5px 0 0;
            color: #6b7280;
            font-size: 14px;
        }

        #messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }

        .message {
            margin-bottom: 18px;
            line-height: 1.6;
        }

        .user {
            text-align: right;
        }

        .bubble {
            display: inline-block;
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 14px;
            white-space: pre-wrap;
        }

        .user .bubble {
            background: #111827;
            color: white;
        }

        .assistant .bubble {
            background: #f3f4f6;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 16px;
            border-top: 1px solid #e5e7eb;
        }

        input {
            flex: 1;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            outline: none;
            font-size: 16px;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 0 22px;
            background: #111827;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }
    </style>
</head>

<body>

<div class="app">

    <header>
        <h1>🤖 Tanmay AI</h1>
        <p>Your professional AI assistant</p>
    </header>

    <div id="messages">
        <div class="message assistant">
            <span class="bubble">Hello! I'm Tanmay AI. How can I help you today?</span>
        </div>
    </div>

    <div class="input-area">
        <input
            id="userInput"
            type="text"
            placeholder="Message Tanmay AI..."
            autocomplete="off"
        >
        <button id="sendButton" onclick="sendMessage()">Send</button>
    </div>

</div>

<script>
const BACKEND_URL = "https://tanmay-ai-0jke.onrender.com";
async function sendMessage() {

    const input = document.getElementById("userInput");
    const button = document.getElementById("sendButton");
    const text = input.value.trim();

    if (!text || button.disabled) return;

    addMessage(text, "user");

    input.value = "";
    button.disabled = true;
    button.textContent = "Thinking...";

    const thinking = addMessage("Tanmay AI is thinking...", "assistant");

    try {

        const response = await fetch(BACKEND_URL + "/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: text
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || "Request failed.");
        }

        thinking.querySelector(".bubble").textContent =
            data.reply || "I couldn't generate a response.";

    } catch (error) {

        thinking.querySelector(".bubble").textContent =
            "Sorry, Tanmay AI could not connect to the AI service.";

        console.error(error);

    } finally {

        button.disabled = false;
        button.textContent = "Send";
        input.focus();
    }
}

function addMessage(text, type) {

    const messages = document.getElementById("messages");

    const message = document.createElement("div");
    message.className = "message " + type;

    const bubble = document.createElement("span");
    bubble.className = "bubble";
    bubble.textContent = text;

    message.appendChild(bubble);
    messages.appendChild(message);

    messages.scrollTop = messages.scrollHeight;

    return message;
}

document.getElementById("userInput").addEventListener(
    "keydown",
    function(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    }
);
</script>

</body>
</html>
